<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="D&D 5e character sheets that save in your browser: track HP, slots, spells and loot." />
  <title>D&amp;D - Characters</title>
  <link rel="stylesheet" href="/style.css?v=8" />
  <link rel="stylesheet" href="/games/dnd/dnd.css?v=1" />
</head>
<body>
  <aside class="sidebar"></aside>
  <main class="main dnd" data-layout="page">
    <div class="dnd-head">
      <h1>Characters</h1>
      <label class="btn" for="import">Import</label>
      <input type="file" id="import" accept=".json,application/json" hidden />
      <a class="btn primary" href="/games/dnd/edit.html">New character</a>
    </div>
    <p class="dnd-note">Saved in this browser only. Export a save file from a sheet to back up or move to another device.</p>
    <ul class="roster" id="roster"></ul>
  </main>
  <script src="/games/dnd/store.js?v=1"></script>
  <script>
    function renderRoster() {
      const ul = document.getElementById('roster');
      const all = DND.list();
      ul.innerHTML = all.length ? '' : '<li class="roster-empty">No characters yet.</li>';
      all.forEach(({ character: c, state }) => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = `/games/dnd/sheet.html?id=${encodeURIComponent(c.id)}`;
        a.innerHTML = '<span class="r-name"></span><span class="r-class"></span><span class="r-hp"></span>';
        a.children[0].textContent = c.identity.name;
        a.children[1].textContent = c.identity.classLine || '';
        const hp = state?.hp || { current: c.combat.hpMax, max: c.combat.hpMax };
        a.children[2].textContent = `${hp.current}/${hp.max} HP`;
        li.appendChild(a);
        ul.appendChild(li);
      });
    }
    document.getElementById('import').addEventListener('change', async e => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      try {
        const id = await DND.importFile(file);
        if (id) location.href = `/games/dnd/sheet.html?id=${encodeURIComponent(id)}`;
      } catch (err) {
        alert('Could not import: ' + err.message);
      }
    });
    renderRoster();
  </script>
  <script src="/sidebar.js?v=5"></script>
</body>
</html>
