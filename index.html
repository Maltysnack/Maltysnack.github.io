<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>maltysnack</title>
  <meta name="description" content="A workshop site by maltysnack. Football models, a small language, algorithm visualisations, and a couple of games." />
  <link rel="stylesheet" href="/style.css?v=10" />
  <script>
    /* Apply theme before paint to avoid flash. */
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
  <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
  <link rel="manifest" href="/manifest.json?v=3" />
  <meta name="theme-color" content="#0c0c0c" />

</head>
<body class="fit">
  <iframe class="home-sky" src="/projects/flock/?ambient" title="" aria-hidden="true" tabindex="-1"></iframe>
  <aside class="sidebar"></aside>
  <main class="main">
    <section class="intro">
      <h1 class="intro-heading">Hello.</h1>
    </section>
  </main>
  <script>
    /* The sky is another document, so pass the theme across on load and on every toggle. */
    (function () {
      var sky = document.querySelector('.home-sky');
      function send() {
        var t = document.documentElement.getAttribute('data-theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        sky.contentWindow.postMessage({ type: 'flock-theme', theme: t }, location.origin);
      }
      sky.addEventListener('load', send);
      new MutationObserver(send).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    })();
  </script>
  <script src="/sidebar.js?v=6"></script>
</body>
</html>
