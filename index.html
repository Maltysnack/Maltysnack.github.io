<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function () { var q = new URLSearchParams(location.search), d = document.documentElement;
    d.dataset.theme = 'dark';
    if (!q.has('nointro') && !matchMedia('(prefers-reduced-motion: reduce)').matches) d.dataset.intro = ''; })();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>maltysnack</title>
  <meta name="description" content="maltysnack: a flock of birds from three simple rules, with weather, a skyline and a few visitors." />
  <link rel="stylesheet" href="/style.css?v=9" />
  <style>
    /* A tool, so it fills the screen and never scrolls. */
    body { height: 100dvh; overflow: hidden; }
    .flock { flex: 1; min-height: 0; position: relative; padding: 0; max-width: none; width: 100%; }
    #stage { position: absolute; inset: 0; display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #stage:active { cursor: grabbing; }

    /* Controls stay out of the way: a title top left, one quiet bar bottom
       left, and the sliders only when asked for. */
    .ov-title { position: absolute; top: clamp(12px, 2.5vh, 24px); left: clamp(12px, 2.5vw, 28px); max-width: 30ch; pointer-events: none; }
    .ov-title p { margin: 0; font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); }
    .ov-bar { position: absolute; left: clamp(12px, 2.5vw, 28px); bottom: clamp(12px, 2.5vh, 24px); display: flex; align-items: center; gap: 4px 14px; flex-wrap: wrap;
              font-size: var(--text-xs); letter-spacing: .08em; text-transform: uppercase; }
    .ov-bar button, .ov-top button, .tune summary { font: inherit; letter-spacing: inherit; text-transform: inherit; background: none; border: 0; border-bottom: 2px solid transparent; padding: 4px 0; color: var(--text-muted); cursor: pointer; }
    .ov-bar button:hover, .ov-top button:hover, .tune summary:hover { color: var(--text); }
    .presets { display: flex; gap: 14px; }
    .presets button.on, .ov-bar button.on, .ov-top button.on, .tune[open] summary { color: var(--text); border-bottom-color: var(--accent); }
    .ov-top { position: absolute; top: clamp(12px, 2.5vh, 24px); right: clamp(12px, 2.5vw, 28px); display: flex; align-items: center; gap: 4px 14px; flex-wrap: wrap; justify-content: flex-end;
              font-size: var(--text-xs); letter-spacing: .08em; text-transform: uppercase; }
    .ov-top span button { margin-left: 14px; } .ov-top span button:first-child { margin-left: 0; }
    .rule { width: 1px; height: 14px; background: var(--border-strong); }
    [data-mode=classic] [data-sky], [data-mode=skyline] .classic-only { display: none; }
    body:not([data-mode]) [data-sky] { display: none; }
    #snd svg { display: block; } #snd.on .slash { display: none; }
    .ov-bar .rule { width: 1px; height: 14px; background: var(--border-strong); }
    .ov-bar label { display: inline-flex; gap: 6px; align-items: center; color: var(--text-muted); cursor: pointer; }
    .ov-bar input[type=checkbox] { accent-color: var(--accent); margin: 0; }
    .tune summary { list-style: none; }
    .tune summary::-webkit-details-marker { display: none; }
    .tune .body { position: absolute; left: 0; bottom: calc(100% + 12px); width: 250px; padding: 10px 0 0; border-top: 2px solid var(--text);
                  background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(6px); text-transform: none; letter-spacing: 0; }
    .ctl { display: grid; grid-template-columns: 74px 1fr 36px; align-items: center; gap: 10px; color: var(--text-muted); margin: 8px 0; }
    .ctl output { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--text); }
    .ctl input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 2px; background: var(--border-strong); margin: 0; }
    .ctl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; background: var(--accent); border: 0; cursor: pointer; }
    .ctl input[type=range]::-moz-range-thumb { width: 10px; height: 10px; background: var(--accent); border: 0; border-radius: 0; cursor: pointer; }
    .stats { position: absolute; right: clamp(12px, 2.5vw, 28px); bottom: 12px; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); pointer-events: none; }

    /* ?intro: the bar and controls stay hidden under the Hello. burst, then fade in. */
    .sidebar, .ov-title, .ov-bar, .ov-top, .stats { transition: opacity .35s ease; }
    html[data-revealing] .sidebar, html[data-revealing] .ov-title, html[data-revealing] .ov-bar, html[data-revealing] .ov-top, html[data-revealing] .stats { transition: opacity 1.2s ease .4s; }
    /* Idle: after a while everything but the scene fades; movement brings it back. */
    html[data-idle] .sidebar, html[data-idle] .ov-title, html[data-idle] .ov-bar, html[data-idle] .ov-top, html[data-idle] .stats { opacity: 0; pointer-events: none; transition: opacity 1.5s ease; }
    html[data-idle] #stage { cursor: none; }
    html[data-intro] .sidebar, html[data-intro] .ov-title, html[data-intro] .ov-bar, html[data-intro] .ov-top, html[data-intro] .stats { opacity: 0; pointer-events: none; }

    @media (max-width: 640px) {
      .stats { top: 10px; bottom: auto; }
      .ov-top { top: 30px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar"></aside>
  <main class="main flock" data-layout="full">
    <canvas id="stage" aria-label="A three-dimensional flock simulation"></canvas>

    <div class="ov-title"><p>based on boids</p></div>
    <div class="ov-top seg">
      <span id="modes"><button data-m="classic" class="on">Classic</button><button data-m="skyline">Skyline</button></span>
    </div>
    <div class="ov-bar">
      <button id="snd" data-sky title="Sound off" aria-label="Sound off"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="17.5" cy="16" r="2.5" fill="currentColor"/><path class="slash" d="M3 3l18 18"/></svg></button>
      <button id="scatter">Scatter</button>
    </div>
    <div class="stats" id="stats"></div>
  </main>

<script type="module" src="/projects/flock/flock.js?v=24"></script>
  <script src="/sidebar.js?v=7"></script>
</body>
</html>
