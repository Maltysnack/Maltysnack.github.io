<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Algorithms - maltysnack</title>
  <meta name="description" content="Search and optimisation algorithms running live: pathfinding, a sliding-tile puzzle and a travelling salesman tour." />
  <link rel="stylesheet" href="/style.css?v=8" />
  <style>
    body.fit .main.al {
      justify-content: flex-start;
      gap: 10px;
      padding: clamp(0.75rem, 2vh, 1.5rem) clamp(1rem, 3vw, 2.5rem);
      max-width: min(1200px, 100%);
    }
    .al-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
    .al-tabs button {
      font: inherit; font-family: var(--font-display); font-size: 18px;
      background: none; border: 0; border-bottom: 2px solid transparent;
      padding: 4px 12px 8px; margin-bottom: -1px; color: var(--text-muted); cursor: pointer;
    }
    .al-tabs button:hover { color: var(--text); }
    .al-tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
    .al-line { margin: 0; color: var(--text-muted); font-size: 14px; }
    .al-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .al-bar select, .al-bar button {
      font: inherit; font-size: 14px; padding: 5px 12px; cursor: pointer;
      border: 1px solid var(--border-strong); border-radius: 4px; background: var(--bg); color: var(--text);
    }
    .al-bar button:hover, .al-bar select:hover { border-color: var(--text); }
    .al-bar button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .al-stats {
      margin-left: auto; font-family: var(--font-mono); font-variant-numeric: tabular-nums;
      font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .al-stats b { color: var(--text); font-weight: 500; }
    .al-stage { flex: 1; min-height: 0; position: relative; }
    .al-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    @media (max-width: 560px) {
      .al-tabs button { font-size: 16px; padding: 4px 8px 8px; }
      .al-stats { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body class="fit">
  <aside class="sidebar"></aside>
  <main class="main al" data-layout="full">
    <div class="al-tabs" role="tablist">
      <button role="tab" data-tab="path">Path</button>
      <button role="tab" data-tab="tiles">Tiles</button>
      <button role="tab" data-tab="tour">Tour</button>
    </div>
    <p class="al-line" id="al-line"></p>
    <div class="al-bar">
      <select id="al-algo" aria-label="Algorithm"></select>
      <button class="primary" id="al-run">Run</button>
      <button id="al-new">New board</button>
      <span class="al-stats" id="al-stats"></span>
    </div>
    <div class="al-stage"><canvas id="al-canvas"></canvas></div>
  </main>
  <script type="module" src="/projects/algorithms/algo-viz.js?v=16"></script>
  <script src="/sidebar.js?v=5"></script>
</body>
</html>
