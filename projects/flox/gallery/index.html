<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flox Gallery - maltysnack</title>
  <meta name="description" content="Public gallery of shared Flox flow-network programs." />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .gl-eyebrow {
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 14px;
    }
    .gl-eyebrow a {
      color: var(--text-dim);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .gl-eyebrow a:hover { color: var(--text); border-bottom-color: var(--text-dim); }
    .gl-eyebrow .sep { padding: 0 8px; opacity: 0.5; }

    .gl-lede {
      font-size: var(--text-base);
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 32px;
      max-width: 680px;
    }

    /* Card grid. Mono accents, understated borders, no shadows. */
    .gl-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 8px;
    }

    .gl-card {
      border: 1px solid var(--border-light);
      border-radius: 6px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg);
    }
    .gl-card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .gl-card h3 {
      font-size: var(--text-md);
      font-weight: 600;
      color: var(--text);
      margin: 0;
      letter-spacing: -0.01em;
      overflow-wrap: anywhere;
    }
    /* Reuse the landing page mode-tag look. */
    .fx-mode-tag {
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-family: var(--font-mono, JetBrains Mono, monospace);
      white-space: nowrap;
    }
    .gl-author {
      font-size: var(--text-sm);
      color: var(--text-muted);
      margin: 0;
    }
    .gl-author .gl-by { color: var(--text-dim); }
    .gl-card .gl-cta {
      font-size: var(--text-xs);
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--accent-red);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      align-self: flex-start;
      margin-top: 2px;
    }
    .gl-card .gl-cta:hover { border-bottom-color: var(--accent-red); }
    .gl-card .gl-cta::after { content: " \2192"; }

    .gl-state {
      font-size: var(--text-base);
      color: var(--text-dim);
      line-height: 1.6;
      font-style: italic;
      max-width: 620px;
      margin-top: 8px;
    }
    .gl-state a {
      color: var(--accent-red);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      font-style: normal;
    }
    .gl-state a:hover { border-bottom-color: var(--accent-red); }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
  <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
  <link rel="manifest" href="/manifest.json?v=3" />
  <meta name="theme-color" content="#13110d" />

</head>
<body>

  <aside class="sidebar"></aside>

  <main class="main" data-layout="full">

    <header class="page-header">
      <p class="gl-eyebrow"><a href="/projects/flox/">Flox</a><span class="sep">/</span>Gallery</p>
      <h1 class="page-title">Gallery</h1>
      <p class="gl-lede">
        Flow-network programs people have shared publicly. Open any one in the playground to read it, run it, and fork it into your own.
      </p>
    </header>

    <div class="gl-grid" id="gl-grid" hidden></div>
    <p class="gl-state" id="gl-state">Loading gallery...</p>

  </main>

  <script src="/sidebar.js"></script>

  <script type="module">
    // Public gallery. Reads the cloud store interface (getStore +
    // listGallery) and builds cards with plain DOM nodes; nothing here
    // ever interpolates user content into innerHTML, so titles and author
    // names from the store cannot inject markup.
    import { getStore } from '../playground/cloud/store.js';

    const gridEl = document.getElementById('gl-grid');
    const stateEl = document.getElementById('gl-state');

    // Mode tags we know how to label; unknown modes pass through verbatim.
    const MODE_LABEL = { river: 'river', markov: 'markov', grid: 'grid' };

    // Small helper: a state message with one optional inline link, built
    // safely from text + DOM nodes (no innerHTML).
    function showState(prefix, linkHref, linkText, suffix) {
      stateEl.textContent = '';
      stateEl.appendChild(document.createTextNode(prefix));
      if (linkHref) {
        const a = document.createElement('a');
        a.href = linkHref;
        a.textContent = linkText;
        stateEl.appendChild(a);
        if (suffix) stateEl.appendChild(document.createTextNode(suffix));
      }
      stateEl.hidden = false;
      gridEl.hidden = true;
    }

    function renderCards(programs) {
      gridEl.textContent = '';
      for (const p of programs) {
        const mode = MODE_LABEL[p.mode] || p.mode || 'river';
        const author = p.authorName ? p.authorName : 'anonymous';
        const title = p.title ? p.title : 'Untitled';
        const href = '/projects/flox/playground/?p=' + encodeURIComponent(p.slug);

        const card = document.createElement('article');
        card.className = 'gl-card';

        const head = document.createElement('div');
        head.className = 'gl-card-head';
        const h3 = document.createElement('h3');
        h3.textContent = title;
        const tag = document.createElement('span');
        tag.className = 'fx-mode-tag';
        tag.textContent = mode;
        head.appendChild(h3);
        head.appendChild(tag);

        const by = document.createElement('p');
        by.className = 'gl-author';
        const byLabel = document.createElement('span');
        byLabel.className = 'gl-by';
        byLabel.textContent = 'by ';
        by.appendChild(byLabel);
        by.appendChild(document.createTextNode(author));

        const cta = document.createElement('a');
        cta.className = 'gl-cta';
        cta.href = href;
        cta.textContent = 'Open in playground';

        card.appendChild(head);
        card.appendChild(by);
        card.appendChild(cta);
        gridEl.appendChild(card);
      }
      stateEl.hidden = true;
      gridEl.hidden = false;
    }

    (async () => {
      try {
        const store = await getStore();
        const programs = await store.listGallery();
        if (!programs || programs.length === 0) {
          showState(
            'No public programs yet. Be the first: build something in the ',
            '/projects/flox/playground/', 'playground', ' and share it.'
          );
          return;
        }
        renderCards(programs);
      } catch (err) {
        console.error('gallery load failed', err);
        showState(
          'Could not load the gallery right now. Try the ',
          '/projects/flox/playground/', 'playground', ' instead.'
        );
      }
    })();
  </script>
</body>
</html>
